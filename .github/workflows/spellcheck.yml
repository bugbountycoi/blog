name: Spellcheck
on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
    # The checkout step
    - uses: actions/checkout@v5.0.0
    - uses: rojopolis/spellcheck-github-actions@0.63.0
      name: Spellcheck
      with:
        config_path: config/spellcheck.yml 
